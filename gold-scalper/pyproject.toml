[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goldscalp"
version = "1.0.0"
description = "Outil de scalping XAU/USD : prix Bybit recalibre sur MT5, analyse technique et fondamentale M1/M5/M15, plans TP1/TP2/SL"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["trading", "scalping", "gold", "xauusd", "bybit", "metatrader5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
# Le coeur tourne sans aucune dependance. Ces extras ne servent qu'au pont MT5.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[project.scripts]
goldscalp = "goldscalp.cli:main"

[tool.setuptools.packages.find]
include = ["goldscalp*"]
